on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ci

    env:
      DOCKER_HOST: tcp://docker-in-docker:2375

    steps:

      - name: Install docker CLI
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz -o /tmp/docker.tgz
          tar -xzf /tmp/docker.tgz -C /tmp
          install -m 0755 /tmp/docker/docker /usr/local/bin/docker
          docker --version

      - name: Network diagnostics
        if: always()
        run: |
          getent hosts docker-in-docker || echo "NOT RESOLVABLE: docker-in-docker"
          cat /etc/resolv.conf
          ip route 2>/dev/null || cat /proc/net/route

      - name: Docker daemon reachable
        run: |
          docker version
          docker info

      - name: Contexts (github)
        if: always()
        run: |
          echo "github.repository_owner='${{ github.repository_owner }}'"
          echo "github.ref_name='${{ github.ref_name }}'"
          echo "GITHUB_REPOSITORY_OWNER='$GITHUB_REPOSITORY_OWNER'"
          echo "GITHUB_REF_NAME='$GITHUB_REF_NAME'"

      - name: Contexts (forgejo)
        if: always()
        run: |
          echo "forgejo.repository_owner='${{ forgejo.repository_owner }}'"
          echo "forgejo.ref_name='${{ forgejo.ref_name }}'"

      - name: Registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login codeberg.org \
            --username "${{ github.repository_owner }}" --password-stdin
