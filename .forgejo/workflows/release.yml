name: Release

# Läuft nur bei einem Tag-Push (z.B. v1.2.0). Siehe RELEASING.md für die
# Konvention, wann ein neues Release gerechtfertigt ist.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    runs-on: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version aus Tag extrahieren
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx aufsetzen
        uses: docker/setup-buildx-action@v3

      - name: Bei Codeberg Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: codeberg.org
          username: ${{ github.actor }}
          # Erfordert ein Repo-/Org-Secret CODEBERG_TOKEN: ein Codeberg-
          # Personal-Access-Token mit "write:package"-Scope. Der von Forgejo
          # automatisch bereitgestellte Actions-Token hat standardmäßig kein
          # Package-Write-Recht auf der Container Registry.
          password: ${{ secrets.CODEBERG_TOKEN }}

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            codeberg.org/danszek/kbai-ui:${{ steps.version.outputs.version }}
            codeberg.org/danszek/kbai-ui:latest
