on:
  push:
    tags:
      - 'v*'

jobs:
  docker:
    runs-on: ci

    env:
      IMAGE: codeberg.org/${{ github.repository_owner }}/kabai-ui

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install docker CLI
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz -o /tmp/docker.tgz
          tar -xzf /tmp/docker.tgz -C /tmp
          install -m 0755 /tmp/docker/docker /usr/local/bin/docker
          docker --version

      # Job-Container laufen IM dind in einem eigenen WORKFLOW-Netz; Compose-
      # Servicenamen (docker-in-docker) sind dort nicht auflösbar. Der dind-
      # Daemon ist das Netz-Gateway des Job-Containers und lauscht auf 2375.
      - name: Resolve docker daemon (dind = network gateway)
        run: |
          GW_HEX=$(awk '$2=="00000000" {print $3; exit}' /proc/net/route)
          GW_IP=$(printf '%d.%d.%d.%d' "0x${GW_HEX:6:2}" "0x${GW_HEX:4:2}" "0x${GW_HEX:2:2}" "0x${GW_HEX:0:2}")
          echo "DOCKER_HOST=tcp://${GW_IP}:2375" >> "$GITHUB_ENV"

      # GITHUB_TOKEN kann sich einloggen, aber nicht ins Package-Registry
      # pushen (401 beim Blob-Upload, Run #23). REGISTRY_TOKEN ist ein
      # Access Token mit write:package als Actions-Secret des Repos.
      - name: Login to Codeberg Registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login codeberg.org \
            --username "${{ github.repository_owner }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.ref_name }} \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:${{ github.ref_name }}" \
            .

      - name: Push Docker image
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.ref_name }}"
