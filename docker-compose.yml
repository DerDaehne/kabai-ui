services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kbai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KBAI_DB_NAME:-kb_ai}
      POSTGRES_USER: ${KBAI_DB_USER:-kb_user}
      POSTGRES_PASSWORD: ${KBAI_DB_PASSWORD:?KBAI_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KBAI_DB_USER:-kb_user} -d ${KBAI_DB_NAME:-kb_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── kbai-ui ──────────────────────────────────────────────────────────────────
  kbai-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kbai-ui
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      KBAI_DB_HOST: postgres
      KBAI_DB_PORT: 5432
      KBAI_DB_NAME: ${KBAI_DB_NAME:-kb_ai}
      KBAI_DB_SSL: "false"
      KBAI_SESSION_SECRET: ${KBAI_SESSION_SECRET:?KBAI_SESSION_SECRET is required}
      KBAI_SESSION_TTL_MINUTES: ${KBAI_SESSION_TTL_MINUTES:-480}
    ports:
      - "${KBAI_PORT:-3000}:3000"

volumes:
  postgres_data:
