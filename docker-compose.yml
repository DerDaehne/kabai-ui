services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kabai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KABAI_DB_NAME:-kabai}
      POSTGRES_USER: ${KABAI_DB_USER:-kb_user}
      POSTGRES_PASSWORD: ${KABAI_DB_PASSWORD:?KABAI_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KABAI_DB_USER:-kb_user} -d ${KABAI_DB_NAME:-kabai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── kabai-ui ──────────────────────────────────────────────────────────────────
  # The image applies pending schema migrations itself on startup (baked-in
  # migrations/ + Node runner, tracked in schema_migrations) — starting a
  # new image is all it takes to bring the database up to date. Baseline
  # for databases that predate the runner:
  #   docker compose run --rm kabai-ui node scripts/migrate.mjs --baseline V6
  kabai-ui:
    image: codeberg.org/danszek/kabai-ui:latest
    # To build from the local checkout instead (development), replace the
    # image line with:
    #   build:
    #     context: .
    #     dockerfile: Dockerfile
    container_name: kabai-ui
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      KABAI_DB_HOST: postgres
      KABAI_DB_PORT: 5432
      KABAI_DB_NAME: ${KABAI_DB_NAME:-kabai}
      KABAI_DB_SSL: "false"
      # Für die automatischen Migrationen beim Start; ohne beide Werte
      # startet die App mit Warnung, ohne zu migrieren.
      KABAI_DB_USER: ${KABAI_DB_USER:-kb_user}
      KABAI_DB_PASSWORD: ${KABAI_DB_PASSWORD:?KABAI_DB_PASSWORD is required}
      KABAI_SESSION_SECRET: ${KABAI_SESSION_SECRET:?KABAI_SESSION_SECRET is required}
      KABAI_SESSION_TTL_MINUTES: ${KABAI_SESSION_TTL_MINUTES:-480}
    ports:
      - "${KABAI_PORT:-3000}:3000"

volumes:
  postgres_data:
