services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kabai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KABAI_DB_NAME:-kabai}
      POSTGRES_USER: ${KABAI_DB_USER:-kb_user}
      POSTGRES_PASSWORD: ${KABAI_DB_PASSWORD:?KABAI_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KABAI_DB_USER:-kb_user} -d ${KABAI_DB_NAME:-kabai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── migrations ───────────────────────────────────────────────────────────────
  # Short-lived runner: applies pending migrations/V*.sql on EVERY
  # `docker compose up` before the app starts (schema_migrations tracking
  # makes re-runs no-ops). Baseline for pre-runner databases:
  #   docker compose run --rm migrate --baseline V6
  migrate:
    image: postgres:16-alpine
    container_name: kabai-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KABAI_DB_HOST: postgres
      KABAI_DB_PORT: 5432
      KABAI_DB_NAME: ${KABAI_DB_NAME:-kabai}
      KABAI_DB_USER: ${KABAI_DB_USER:-kb_user}
      KABAI_DB_PASSWORD: ${KABAI_DB_PASSWORD:?KABAI_DB_PASSWORD is required}
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]

  # ── kabai-ui ──────────────────────────────────────────────────────────────────
  kabai-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kabai-ui
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      KABAI_DB_HOST: postgres
      KABAI_DB_PORT: 5432
      KABAI_DB_NAME: ${KABAI_DB_NAME:-kabai}
      KABAI_DB_SSL: "false"
      KABAI_SESSION_SECRET: ${KABAI_SESSION_SECRET:?KABAI_SESSION_SECRET is required}
      KABAI_SESSION_TTL_MINUTES: ${KABAI_SESSION_TTL_MINUTES:-480}
    ports:
      - "${KABAI_PORT:-3000}:3000"

volumes:
  postgres_data:
